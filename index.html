<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolvEDU — Technical Bounty Hunter Platform</title>
    <meta
      name="description"
      content="SolvEDU connects world-class companies with top-tier student researchers. Find bounties, ship solutions, build reputation."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M11 12.5h10M11 16h6.5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='20' r='3.6' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M24.2 22.7L27 25.5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so the glass never flashes the wrong mode.
      ;(() => {
        try {
          const stored = localStorage.getItem('solv-edu:theme')
          const dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* private mode — the default `dark` class on <html> stands. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
